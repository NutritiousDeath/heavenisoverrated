<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos — Heaven is Overrated</title>
  <meta name="description" content="Music videos from Heaven is Overrated — F.A.F.O., Sigma, and The End of Everything.">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .video-grid { display: grid; grid-template-columns: 1fr; gap: 60px; max-width: 900px; margin: 0 auto; }
    .video-card { text-align: center; }
    .video-frame-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: 4px; overflow: hidden; border: 1px solid rgba(184,157,106,0.25); box-shadow: 0 0 30px rgba(0,0,0,0.5); margin-bottom: 18px; }
    .video-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-title { font-family: var(--font-heading); font-size: 1.2rem; letter-spacing: 1px; color: var(--gold-light); margin-bottom: 6px; }
    .video-meta { font-family: var(--font-body); font-size: 0.9rem; color: var(--grey); }
  </style>
</head>
<body>

  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav scrolled" id="nav">
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="music.html">Music</a>
      <a href="videos.html" class="active">Videos</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-bg" style="background-image: url('Art/compass.jpg');"></div>
    <div class="page-header-content">
      <div class="section-title">Videos</div>
      <div class="section-label">Watch</div>
    </div>
  </div>

  <section class="section">
    <div class="section-inner" style="max-width: 900px;">
      <div class="video-grid">

        <div class="video-card reveal">
          <div class="video-frame-wrap">
            <iframe src="https://www.youtube.com/embed/wBFKSNv-NlU" title="F.A.F.O." allowfullscreen></iframe>
          </div>
          <div class="video-title">F.A.F.O.</div>
          <div class="video-meta">feat. Pills on the Parmesian</div>
        </div>

        <div class="video-card reveal">
          <div class="video-frame-wrap">
            <iframe src="https://www.youtube.com/embed/TptcETe843c" title="The End of Everything" allowfullscreen></iframe>
          </div>
          <div class="video-title">The End of Everything</div>
          <div class="video-meta">Music Video</div>
        </div>

        <div class="video-card reveal">
          <div class="video-frame-wrap">
            <iframe src="https://www.youtube.com/embed/ej1pMBKuDyc" title="Sigma (Glitch)" allowfullscreen></iframe>
          </div>
          <div class="video-title">Sigma</div>
          <div class="video-meta">Glitch Video</div>
        </div>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="compass">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="0.5" color="#6b5a3e">
        <circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="6"/>
        <line x1="20" y1="2" x2="20" y2="38"/><line x1="2" y1="20" x2="38" y2="20"/>
        <line x1="8" y1="8" x2="32" y2="32" stroke-dasharray="2 3"/><line x1="32" y1="8" x2="8" y2="32" stroke-dasharray="2 3"/>
      </svg>
    </div>
    <div class="footer-logo">Heaven is Overrated</div>
    <div class="footer-sub">&copy; 2026 &mdash; All Rights Reserved</div>
  </footer>

  <script>
    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function() { nav.classList.toggle('scrolled', window.scrollY > 80); });
    var reveals = document.querySelectorAll('.reveal');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
    }, { threshold: 0.15 });
    reveals.forEach(function(el) { observer.observe(el); });

    var hamburger = document.getElementById('navHamburger');
    var navLinks = document.getElementById('navLinks');
    var navOverlay = document.getElementById('navOverlay');
    function toggleNav() {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        navOverlay.style.display = 'block';
        setTimeout(function(){ navOverlay.classList.add('visible'); }, 10);
      } else {
        navOverlay.classList.remove('visible');
        setTimeout(function(){ navOverlay.style.display = 'none'; }, 300);
      }
    }
    hamburger.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);
    navLinks.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { if (navLinks.classList.contains('open')) toggleNav(); }); });
  </script>

</body>
</html>
