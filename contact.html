<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Heaven is Overrated</title>
  <meta name="description" content="Get in touch with Heaven is Overrated. Social links, streaming, and contact info.">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 40px;
      max-width: 700px;
      margin: 0 auto;
    }
    .contact-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-decoration: none;
      padding: 30px 20px;
      border: 1px solid rgba(107,90,62,0.08);
      background: rgba(26,23,20,0.4);
      transition: all 0.4s ease;
    }
    .contact-card:hover {
      border-color: rgba(107,90,62,0.3);
      background: rgba(26,23,20,0.7);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .contact-card-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(107,90,62,0.25);
      border-radius: 50%;
      color: var(--gold);
      transition: all 0.3s ease;
    }
    .contact-card:hover .contact-card-icon {
      border-color: var(--purple-glow);
      color: var(--purple-light);
      box-shadow: 0 0 20px rgba(139,95,207,0.15);
    }
    .contact-card-icon svg { width: 22px; height: 22px; fill: currentColor; }
    .contact-card-label {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--grey);
      transition: color 0.3s;
    }
    .contact-card:hover .contact-card-label { color: var(--gold); }
    .contact-card-detail {
      font-size: 0.85rem;
      color: var(--cream);
      opacity: 0.7;
      text-align: center;
    }
    .contact-note {
      text-align: center;
      max-width: 500px;
      margin: 60px auto 0;
      font-size: 1rem;
      font-style: italic;
      color: var(--cream);
      opacity: 0.4;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav scrolled" id="nav">
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="music.html">Music</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-bg" style="background-image: url('Art/compass.jpg');"></div>
    <div class="page-header-content">
      <div class="section-title">Contact</div>
      <div class="section-label">Reach Out</div>
    </div>
  </div>

  <section class="section">
    <div class="section-inner">
      <div class="contact-grid reveal">

        <!-- Email -->
        <a href="mailto:contact@heavenisoverrated.com" class="contact-card">
          <div class="contact-card-icon">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </div>
          <div class="contact-card-label">Email</div>
        </a>

        <!-- Spotify -->
        <a href="https://open.spotify.com/artist/3CElMQrmVL4bXO52aQG09V" target="_blank" rel="noopener" class="contact-card">
          <div class="contact-card-icon">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
          </div>
          <div class="contact-card-label">Spotify</div>
        </a>

        <!-- YouTube Music -->
        <a href="https://music.youtube.com/channel/UCTu9P7F57HkLjvuessj2ccQ" target="_blank" rel="noopener" class="contact-card">
          <div class="contact-card-icon">
            <svg viewBox="0 0 24 24"><path d="M21.582 6.186a2.477 2.477 0 00-1.768-1.768C18.254 4 12 4 12 4s-6.254 0-7.814.418c-.86.23-1.538.908-1.768 1.768C2 7.746 2 12 2 12s0 4.254.418 5.814c.23.86.908 1.538 1.768 1.768C5.746 20 12 20 12 20s6.254 0 7.814-.418a2.477 2.477 0 001.768-1.768C22 16.254 22 12 22 12s0-4.254-.418-5.814zM10 15.464V8.536L16 12l-6 3.464z"/></svg>

        <!-- Twitter/X -->
        <a href="https://x.com/killingslave" target="_blank" rel="noopener" class="contact-card">
          <div class="contact-card-icon">
            <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </div>
          <div class="contact-card-label">X / Twitter</div>
        </a>

      </div>

      <p class="contact-note reveal">Want to talk shop, collab, or just tell me which track hit you the hardest? Hit me up.</p>
    </div>
  </section>

  <footer class="footer">
    <div class="compass">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="0.5" color="#6b5a3e">
        <circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="6"/>
        <line x1="20" y1="2" x2="20" y2="38"/><line x1="2" y1="20" x2="38" y2="20"/>
        <line x1="8" y1="8" x2="32" y2="32" stroke-dasharray="2 3"/><line x1="32" y1="8" x2="8" y2="32" stroke-dasharray="2 3"/>
      </svg>
    </div>
    <div class="footer-logo">Heaven is Overrated</div>
    <div class="footer-sub">&copy; 2026 &mdash; All Rights Reserved</div>
  </footer>

  <script>
    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function(){ nav.classList.toggle('scrolled', window.scrollY>80); });
    var reveals = document.querySelectorAll('.reveal');
    var observer = new IntersectionObserver(function(entries){ entries.forEach(function(entry){ if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);} }); }, {threshold:0.15});
    reveals.forEach(function(el){ observer.observe(el); });

    /* Hamburger menu */
    var hamburger = document.getElementById('navHamburger');
    var navLinks = document.getElementById('navLinks');
    var navOverlay = document.getElementById('navOverlay');
    function toggleNav() {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        navOverlay.style.display = 'block';
        setTimeout(function(){ navOverlay.classList.add('visible'); }, 10);
      } else {
        navOverlay.classList.remove('visible');
        setTimeout(function(){ navOverlay.style.display = 'none'; }, 300);
      }
    }
    hamburger.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);
    navLinks.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { if (navLinks.classList.contains('open')) toggleNav(); }); });
  </script>

</body>
</html>
