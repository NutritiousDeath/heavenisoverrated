<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heaven is Overrated & Pills on the Parmesian</title>
  <meta name="description" content="Heaven is Overrated & Pills on the Parmesian.">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0a0a0f; overflow: hidden; height: 100%; }

    .intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .gate-left, .gate-right {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      background: #0a0a0f;
      transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1);
      z-index: 2;
    }
    .gate-left { left: 0; }
    .gate-right { right: 0; }

    .gate-left::before, .gate-right::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='5' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
      opacity: 0.4;
    }

    .gate-seam {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100%;
      background: linear-gradient(180deg, transparent 5%, rgba(184,157,106,0.4) 20%, rgba(184,157,106,0.6) 50%, rgba(184,157,106,0.4) 80%, transparent 95%);
      z-index: 3;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .gate-crack {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 100%;
      z-index: 4;
      opacity: 0;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(184,157,106,0.1) 10%,
        rgba(184,157,106,0.8) 30%,
        rgba(212,191,138,1) 50%,
        rgba(184,157,106,0.8) 70%,
        rgba(184,157,106,0.1) 90%,
        transparent 100%
      );
      filter: blur(2px);
      box-shadow: 0 0 30px rgba(184,157,106,0.5), 0 0 60px rgba(184,157,106,0.2);
    }

    .intro-center {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro-ember {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #b89d6a;
      box-shadow: 0 0 20px rgba(184,157,106,0.8), 0 0 40px rgba(184,157,106,0.4), 0 0 80px rgba(184,157,106,0.2);
      opacity: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .intro-compass { width: 120px; height: 120px; opacity: 0; }
    .intro-compass svg { width: 100%; height: 100%; }
    .intro-compass .draw-line { stroke-dasharray: 200; stroke-dashoffset: 200; }

    .intro-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.4rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 6px;
      color: #d4bf8a;
      text-shadow: 0 0 30px rgba(184,157,106,0.3);
      opacity: 0;
      margin-top: 24px;
      text-align: center;
      white-space: nowrap;
    }

    .intro-tagline {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #b088d4;
      text-shadow: 0 0 20px rgba(139,95,207,0.4);
      opacity: 0;
      margin-top: 12px;
    }

    .intro-particles { position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none; }
    .particle { position: absolute; border-radius: 50%; background: #b89d6a; opacity: 0; }

    .intro-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184,157,106,0.15) 0%, transparent 70%);
      opacity: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .intro-overlay.gates-open .gate-left { transform: translateX(-105%); }
    .intro-overlay.gates-open .gate-right { transform: translateX(105%); }
    .intro-overlay.gates-open .gate-seam { opacity: 0 !important; }
    .intro-overlay.gates-open .intro-center { opacity: 0; transition: opacity 0.4s ease; }
    .intro-overlay.gates-open .intro-particles { opacity: 0; transition: opacity 0.6s ease; }
    .intro-overlay.done { display: none; }

    @media (max-width: 480px) {
      .intro-compass { width: 80px; height: 80px; }
      .intro-title { letter-spacing: 3px; }
      .intro-tagline { letter-spacing: 4px; font-size: 0.55rem; }
    }

    /* ═══ SPLASH CHOICE SCREEN ═══ */
    .splash-choice {
      position: fixed;
      inset: 0;
      z-index: 99998;
      display: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    .splash-choice.visible { display: flex; opacity: 1; }
    .splash-panel {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      overflow: hidden;
      cursor: pointer;
      transition: flex 0.5s ease;
    }
    .splash-panel:hover { flex: 1.15; }
    .splash-panel-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s ease, filter 0.6s ease;
      filter: brightness(0.4) saturate(1.1);
    }
    .splash-panel:hover .splash-panel-bg { transform: scale(1.06); filter: brightness(0.55) saturate(1.2); }
    .splash-panel-hisor .splash-panel-bg { background-color: #0a0a0f; }
    .splash-panel-pills .splash-panel-bg { background-color: #050308; }
    .splash-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.65) 100%);
    }
    .splash-panel-content { position: relative; z-index: 2; text-align: center; padding: 20px; }
    .splash-panel-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(1.2rem, 3vw, 2rem);
      letter-spacing: 3px;
      color: #d4bf8a;
      text-shadow: 0 0 25px rgba(184,157,106,0.4);
      margin-bottom: 10px;
    }
    .splash-panel-pills .splash-panel-title { color: #b565ff; text-shadow: 0 0 25px rgba(139,47,214,0.5); }
    .splash-panel-sub {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #8a847e;
    }
    .splash-seam {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 100%;
      background: linear-gradient(180deg, transparent, rgba(184,157,106,0.3), transparent);
      z-index: 3;
    }
    @media (max-width: 640px) {
      .splash-choice { flex-direction: column; }
      .splash-seam { width: 100%; height: 1px; top: 50%; left: 0; transform: translateY(-50%); }
    }
  </style>
</head>
<body>

  <!-- ═══ CINEMATIC INTRO ═══ -->
  <div class="intro-overlay" id="introOverlay">
    <div class="gate-left"></div>
    <div class="gate-right"></div>
    <div class="gate-seam" id="gateSeam"></div>
    <div class="gate-crack" id="gateCrack"></div>
    <div class="intro-particles" id="particles"></div>

    <div class="intro-center" id="introCenter">
      <div class="intro-glow" id="introGlow"></div>
      <div class="intro-ember" id="introEmber"></div>

      <div class="intro-compass" id="introCompass">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="60" cy="60" r="45" stroke="#b89d6a" stroke-width="0.8" class="draw-line" style="stroke-dasharray:283;stroke-dashoffset:283"/>
          <circle cx="60" cy="60" r="22" stroke="#b89d6a" stroke-width="0.6" class="draw-line" style="stroke-dasharray:138;stroke-dashoffset:138"/>
          <line x1="60" y1="8" x2="60" y2="112" stroke="#b89d6a" stroke-width="0.6" class="draw-line" style="stroke-dasharray:104;stroke-dashoffset:104"/>
          <line x1="8" y1="60" x2="112" y2="60" stroke="#b89d6a" stroke-width="0.6" class="draw-line" style="stroke-dasharray:104;stroke-dashoffset:104"/>
          <line x1="22" y1="22" x2="98" y2="98" stroke="#b89d6a" stroke-width="0.4" stroke-dasharray="3 4" class="draw-line" style="stroke-dasharray:200;stroke-dashoffset:200"/>
          <line x1="98" y1="22" x2="22" y2="98" stroke="#b89d6a" stroke-width="0.4" stroke-dasharray="3 4" class="draw-line" style="stroke-dasharray:200;stroke-dashoffset:200"/>
          <line x1="60" y1="8" x2="60" y2="15" stroke="#d4bf8a" stroke-width="1.2" class="draw-line" style="stroke-dasharray:7;stroke-dashoffset:7"/>
          <line x1="60" y1="105" x2="60" y2="112" stroke="#d4bf8a" stroke-width="1.2" class="draw-line" style="stroke-dasharray:7;stroke-dashoffset:7"/>
          <line x1="8" y1="60" x2="15" y2="60" stroke="#d4bf8a" stroke-width="1.2" class="draw-line" style="stroke-dasharray:7;stroke-dashoffset:7"/>
          <line x1="105" y1="60" x2="112" y2="60" stroke="#d4bf8a" stroke-width="1.2" class="draw-line" style="stroke-dasharray:7;stroke-dashoffset:7"/>
          <rect x="56" y="56" width="8" height="8" transform="rotate(45 60 60)" stroke="#d4bf8a" stroke-width="0.8" fill="none" class="draw-line" style="stroke-dasharray:34;stroke-dashoffset:34"/>
        </svg>
      </div>

      <div class="intro-title" id="introTitle">Heaven is Overrated</div>
      <div class="intro-tagline" id="introTagline">Enter · Remember · Ascend</div>
    </div>
  </div>

  <!-- ═══ SPLASH CHOICE SCREEN ═══ -->
  <div class="splash-choice" id="splashChoice">
    <div class="splash-seam"></div>
    <a href="#" class="splash-panel splash-panel-hisor" id="choiceHisor">
      <div class="splash-panel-bg" style="background-image: url('Art/compass.jpg');"></div>
      <div class="splash-panel-content">
        <div class="splash-panel-title">Heaven is Overrated</div>
        <div class="splash-panel-sub">Instrumental Symphonic Metal</div>
      </div>
    </a>
    <a href="pills/index.html" class="splash-panel splash-panel-pills" id="choicePills">
      <div class="splash-panel-bg" style="background-image: url('pills/art/aura-hero.png');"></div>
      <div class="splash-panel-content">
        <div class="splash-panel-title">Pills on the Parmesian</div>
        <div class="splash-panel-sub">The Signal That Survives</div>
      </div>
    </a>
  </div>

  <script>
    (function() {
      var splashChoice = document.getElementById('splashChoice');
      var introOverlay = document.getElementById('introOverlay');

      function showSplash() {
        splashChoice.classList.add('visible');
      }

      var siteChosen = sessionStorage.getItem('hisor_site_choice');
      var introSeen = sessionStorage.getItem('hisor_intro_seen');

      // Already chose Heaven is Overrated this session — redirect immediately, no animation
      if (siteChosen) {
        window.location.replace('home.html');
        return;
      }

      // Seen the gate animation before, but hasn't chosen yet — skip gate, show splash immediately
      if (introSeen) {
        introOverlay.classList.add('done');
        showSplash();
        return;
      }

      var overlay = introOverlay;
      var ember = document.getElementById('introEmber');
      var compass = document.getElementById('introCompass');
      var glow = document.getElementById('introGlow');
      var title = document.getElementById('introTitle');
      var tagline = document.getElementById('introTagline');
      var seam = document.getElementById('gateSeam');
      var crack = document.getElementById('gateCrack');
      var particlesContainer = document.getElementById('particles');
      var drawLines = document.querySelectorAll('.draw-line');

      var style = document.createElement('style');
      var keyframes = '';
      for (var k = 0; k < 6; k++) {
        var drift = (Math.random() > 0.5 ? 1 : -1) * (20 + Math.random() * 60);
        keyframes += '@keyframes pf' + k + '{0%{opacity:0;transform:translateY(0) scale(0)}15%{opacity:' + (0.3 + Math.random() * 0.4) + ';transform:scale(1)}100%{opacity:0;transform:translateY(-100vh) translateX(' + drift + 'px) scale(0)}}';
      }
      style.textContent = keyframes;
      document.head.appendChild(style);

      function spawnParticles() {
        for (var i = 0; i < 35; i++) {
          var p = document.createElement('div');
          p.className = 'particle';
          p.style.left = (10 + Math.random() * 80) + '%';
          p.style.bottom = '-5%';
          var size = 1 + Math.random() * 3;
          p.style.width = size + 'px';
          p.style.height = size + 'px';
          p.style.animation = 'pf' + Math.floor(Math.random() * 6) + ' ' + (3 + Math.random() * 4) + 's ease-out ' + (Math.random() * 2.5) + 's forwards';
          particlesContainer.appendChild(p);
        }
      }

      setTimeout(function() {
        ember.style.transition = 'opacity 0.6s ease, box-shadow 0.6s ease, width 0.3s ease, height 0.3s ease';
        ember.style.opacity = '1';
        ember.style.boxShadow = '0 0 30px rgba(184,157,106,1), 0 0 60px rgba(184,157,106,0.6), 0 0 100px rgba(184,157,106,0.3)';
        setTimeout(function() {
          ember.style.width = '14px';
          ember.style.height = '14px';
          setTimeout(function() {
            ember.style.width = '6px';
            ember.style.height = '6px';
          }, 200);
        }, 300);
      }, 400);

      setTimeout(function() {
        ember.style.transition = 'opacity 0.3s ease';
        ember.style.opacity = '0';
        compass.style.transition = 'opacity 0.4s ease';
        compass.style.opacity = '1';
        glow.style.transition = 'opacity 0.6s ease';
        glow.style.opacity = '1';

        drawLines.forEach(function(line, i) {
          setTimeout(function() {
            line.style.transition = 'stroke-dashoffset 0.8s ease-out';
            line.style.strokeDashoffset = '0';
          }, i * 100);
        });

        spawnParticles();
      }, 1200);

      setTimeout(function() {
        glow.style.transition = 'width 0.6s ease, height 0.6s ease, opacity 0.6s ease';
        glow.style.width = '280px';
        glow.style.height = '280px';
        glow.style.opacity = '0.5';
        setTimeout(function() {
          glow.style.width = '200px';
          glow.style.height = '200px';
          glow.style.opacity = '0.25';
        }, 600);

        title.style.transition = 'opacity 0.8s ease, transform 0.8s ease';
        title.style.opacity = '1';
        title.style.transform = 'translateY(-5px)';
        setTimeout(function() { title.style.transform = 'translateY(0)'; }, 50);
      }, 2800);

      setTimeout(function() {
        tagline.style.transition = 'opacity 0.6s ease';
        tagline.style.opacity = '1';
        seam.style.opacity = '1';
      }, 3600);

      setTimeout(function() {
        crack.style.transition = 'opacity 0.15s ease';
        crack.style.opacity = '1';

        setTimeout(function() {
          crack.style.opacity = '0.6';
        }, 150);

        setTimeout(function() {
          crack.style.transition = 'opacity 0.4s ease';
          crack.style.opacity = '0';
          seam.style.transition = 'opacity 0.3s ease';
          seam.style.opacity = '0';
          overlay.classList.add('gates-open');
          showSplash();
        }, 400);

        setTimeout(function() {
          overlay.classList.add('done');
          sessionStorage.setItem('hisor_intro_seen', '1');
        }, 2000);
      }, 4600);
    })();

    document.getElementById('choiceHisor').addEventListener('click', function(e) {
      e.preventDefault();
      sessionStorage.setItem('hisor_site_choice', '1');
      window.location.href = 'home.html';
    });
    /* Pills panel uses a normal href — navigates directly to pills/index.html */
  </script>

</body>
</html>
