<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Signal</title>
  <meta name="description" content="Heaven is Overrated & Pills on the Parmesian. Two signals. One frequency. Choose your path.">
  <meta name="theme-color" content="#08070a">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #08070a;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
    }

    .gateway { position: relative; height: 100vh; width: 100vw; display: flex; }

    .side {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-decoration: none;
      transition: flex 0.6s cubic-bezier(0.76,0,0.24,1);
      cursor: pointer;
    }

    /* Give the hovered side more room, the room grows into it */
    .gateway:has(.side-hior:hover) .side-hior { flex: 1.15; }
    .gateway:has(.side-hior:hover) .side-pills { flex: 0.85; }
    .gateway:has(.side-pills:hover) .side-pills { flex: 1.15; }
    .gateway:has(.side-pills:hover) .side-hior { flex: 0.85; }

    .side-bg {
      position: absolute;
      inset: -5% -20% -5% -20%;
      background-size: cover;
      background-position: center;
      transition: transform 0.8s ease, filter 0.8s ease;
    }
    .side:hover .side-bg { transform: scale(1.06); }

    /* HIOR side */
    .side-hior { background: #0a0a0f; }
    .side-hior .side-bg {
      background-image:
        radial-gradient(ellipse at 50% 30%, rgba(184,157,106,0.18) 0%, transparent 60%),
        url('Art/compass.jpg');
      filter: brightness(0.4) saturate(1.1);
    }
    .side-hior:hover .side-bg { filter: brightness(0.55) saturate(1.2); }

    /* PILLS side */
    .side-pills { background: #08040d; }
    .side-pills .side-bg {
      background-image:
        radial-gradient(ellipse at 50% 30%, rgba(139,47,214,0.28) 0%, transparent 60%),
        url('pills/art/aura-hero.png');
      filter: brightness(0.4) saturate(1.15);
    }
    .side-pills:hover .side-bg { filter: brightness(0.58) saturate(1.3); }

    .side-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 420px;
    }

    .side-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 18px;
    }

    .side-title {
      line-height: 1.05;
      margin-bottom: 16px;
    }

    .side-tagline {
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0.75;
      line-height: 1.6;
    }

    .side-hior .side-eyebrow { color: #b088d4; }
    .side-hior .side-title {
      font-family: 'Cinzel Decorative', serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      letter-spacing: 2px;
      color: #d4bf8a;
      text-shadow: 0 0 30px rgba(184,157,106,0.35);
    }
    .side-hior .side-tagline { color: #cfc3a8; }

    .side-pills .side-eyebrow { color: #3ee8ff; }
    .side-pills .side-title {
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: clamp(1.3rem, 3.6vw, 2.2rem);
      letter-spacing: 3px;
      color: #e8e2f5;
      text-shadow: 0 0 30px rgba(139,47,214,0.55);
    }
    .side-pills .side-tagline { color: #c8bfe0; }

    /* Center seam */
    .seam {
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 1px; height: 100%;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.15) 15%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.15) 85%, transparent 100%);
      z-index: 3;
      pointer-events: none;
    }
    .seam-vs {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(8,7,10,0.85);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.6);
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    @media (max-width: 760px) {
      .gateway { flex-direction: column; }
      .gateway:has(.side-hior:hover) .side-hior,
      .gateway:has(.side-pills:hover) .side-pills { flex: 1.15; }
      .gateway:has(.side-hior:hover) .side-pills,
      .gateway:has(.side-pills:hover) .side-hior { flex: 0.85; }
      .seam { top: 50%; left: 0; transform: translateY(-50%); width: 100%; height: 1px;
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 15%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.15) 85%, transparent 100%); }
      .side-title { font-size: clamp(1.3rem, 6vw, 2rem) !important; }
      .side-content { max-width: 90%; }
    }
  </style>
</head>
<body>

  <div class="gateway" id="gateway">
    <a href="home.html" class="side side-hior" id="sideHior">
      <div class="side-bg"></div>
      <div class="side-content">
        <div class="side-eyebrow">Instrumental Symphonic Metal</div>
        <div class="side-title">Heaven is<br>Overrated</div>
        <div class="side-tagline">Enter. Remember. Ascend.</div>
      </div>
    </a>

    <div class="seam"></div>
    <div class="seam-vs">&times;</div>

    <a href="pills/index.html" class="side side-pills" id="sidePills">
      <div class="side-bg"></div>
      <div class="side-content">
        <div class="side-eyebrow">The Signal That Survives</div>
        <div class="side-title">Pills on the<br>Parmesian</div>
        <div class="side-tagline">Purple lightning through a dead city.</div>
      </div>
    </a>
  </div>

</body>
</html>
