<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The End of Everything — Heaven is Overrated</title>
  <meta name="description" content="The End of Everything — full album from Heaven is Overrated. Instrumental Symphonic Metal. 2026.">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav scrolled" id="nav">
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="../index.html">Home</a>
      <a href="../music.html" class="active">Music</a>
      <a href="../videos.html">Videos</a>
      <a href="../about.html">About</a>
      <a href="../contact.html">Contact</a>
    </div>
  </nav>

  <div class="page-header" style="padding-bottom: 40px;">
    <div class="page-header-bg" style="background-image: url('../Art/eoe.png');"></div>
    <div class="page-header-content">
      <div class="section-title">The End of Everything</div>
      <div class="section-label">Full Album · 2026</div>
    </div>
  </div>

  <section class="section" style="padding-top: 40px;">
    <div class="section-inner" style="text-align:center;">

      <img src="../Art/eoe.png" alt="The End of Everything" style="width:280px; height:280px; object-fit:cover; border:1px solid rgba(107,90,62,0.2); box-shadow:0 0 40px rgba(0,0,0,0.5); margin-bottom:30px;" class="reveal">

      <div class="action-row reveal">
        <a href="#" class="action-btn primary">Spotify</a>
        <a href="#" class="action-btn">Apple Music</a>
        <a href="#" class="action-btn">Amazon Music</a>
        <a href="https://music.youtube.com/channel/UCTu9P7F57HkLjvuessj2ccQ" target="_blank" rel="noopener" class="action-btn">YT Music</a>
      </div>
      <p style="text-align:center; font-size:0.8rem; color:var(--grey); margin-top:16px;" class="reveal">Track-specific streaming links coming soon</p>

      <div style="text-align: center; margin-top: 40px;" class="reveal">
        <a href="../music.html" style="font-family: var(--font-heading); font-size: 0.6rem; letter-spacing: 4px; text-transform: uppercase; color: var(--grey); text-decoration: none; transition: color 0.3s;"
           onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--grey)'">&larr; Back to Discography</a>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="compass">
      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="0.5" color="#6b5a3e">
        <circle cx="20" cy="20" r="12"/><circle cx="20" cy="20" r="6"/>
        <line x1="20" y1="2" x2="20" y2="38"/><line x1="2" y1="20" x2="38" y2="20"/>
        <line x1="8" y1="8" x2="32" y2="32" stroke-dasharray="2 3"/><line x1="32" y1="8" x2="8" y2="32" stroke-dasharray="2 3"/>
      </svg>
    </div>
    <div class="footer-logo">Heaven is Overrated</div>
    <div class="footer-sub">&copy; 2026 &mdash; All Rights Reserved</div>
  </footer>

  <script>
    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function(){ nav.classList.toggle('scrolled', window.scrollY>80); });
    var reveals = document.querySelectorAll('.reveal');
    var observer = new IntersectionObserver(function(entries){ entries.forEach(function(entry){ if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);} }); }, {threshold:0.15});
    reveals.forEach(function(el){ observer.observe(el); });

    var hamburger = document.getElementById('navHamburger');
    var navLinks = document.getElementById('navLinks');
    var navOverlay = document.getElementById('navOverlay');
    function toggleNav() {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        navOverlay.style.display = 'block';
        setTimeout(function(){ navOverlay.classList.add('visible'); }, 10);
      } else {
        navOverlay.classList.remove('visible');
        setTimeout(function(){ navOverlay.style.display = 'none'; }, 300);
      }
    }
    hamburger.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);
    navLinks.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { if (navLinks.classList.contains('open')) toggleNav(); }); });
  </script>

</body>
</html>
