           onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--grey)'">&larr; Back to Discography</a>

  <footer class="footer">

      <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="0.5" color="#6b5a3e">

        <line x1="8" y1="8" x2="32" y2="32" stroke-dasharray="2 3"/><line x1="32" y1="8" x2="8" y2="32" stroke-dasharray="2 3"/>
      </svg>
    </div>
    <div class="footer-logo">Heaven is Overrated</div>
    <div class="footer-sub">&copy; 2026 &mdash; All Rights Reserved</div>
  </footer>

  <script>
    var tracks = [
      { num: 1, name: "Zero Hour",     file: "../Songs/WarfrontAct1/01 - Zero Hour.mp3" },
      { num: 2, name: "Mobilize",      file: "../Songs/WarfrontAct1/02 - Mobilize.mp3" },
      { num: 3, name: "SITREP",        file: "../Songs/WarfrontAct1/03 - Sitrep.mp3" },
      { num: 4, name: "Radio Silence", file: "../Songs/WarfrontAct1/04 - Radio Silence.mp3" },
      { num: 5, name: "Contact Front", file: "../Songs/WarfrontAct1/05 - Contact Front.mp3" }
    ];

    var audio = new Audio();
    var currentTrackIndex = 0;
    var isPlaying = false;
    var playerTrackName = document.getElementById('playerTrackName');
    var playBtn = document.getElementById('playBtn');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');
    var progressBar = document.getElementById('progressBar');
    var progressFill = document.getElementById('progressFill');
    var currentTimeEl = document.getElementById('currentTime');
    var totalTimeEl = document.getElementById('totalTime');
    var tracklist = document.getElementById('tracklist');

    function formatTime(s) { if (isNaN(s)) return '0:00'; var m = Math.floor(s/60); var sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

    function buildTracklist() {
      tracklist.innerHTML = '';
      tracks.forEach(function(track, i) {
        var div = document.createElement('div');
        div.className = 'cp-track' + (i === 0 ? ' active' : '');
        div.innerHTML = '<span class="cp-track-num">'+String(track.num).padStart(2,'0')+'</span><span class="cp-track-name">'+track.name+'</span><span class="cp-track-dur" data-index="'+i+'">--:--</span>';
        div.addEventListener('click', function() { currentTrackIndex = i; loadTrack(i); playTrack(); });
        tracklist.appendChild(div);
      });
    }

    function loadTrack(index) {
      if (!tracks[index]) return;
      audio.src = tracks[index].file; audio.load();
      playerTrackName.textContent = tracks[index].name;
      tracklist.querySelectorAll('.cp-track').forEach(function(el,i){ el.classList.toggle('active', i===index); });
      progressFill.style.width = '0%'; currentTimeEl.textContent = '0:00';
    }

    function playTrack() { audio.play().then(function(){ isPlaying=true; playIcon.style.display='none'; pauseIcon.style.display='block'; }).catch(function(){}); }
    function pauseTrack() { audio.pause(); isPlaying=false; playIcon.style.display='block'; pauseIcon.style.display='none'; }

    playBtn.addEventListener('click', function(){ if(isPlaying) pauseTrack(); else playTrack(); });
    prevBtn.addEventListener('click', function(){ if(audio.currentTime>3){audio.currentTime=0;}else{currentTrackIndex=(currentTrackIndex-1+tracks.length)%tracks.length; loadTrack(currentTrackIndex); if(isPlaying) playTrack();} });
    nextBtn.addEventListener('click', function(){ currentTrackIndex=(currentTrackIndex+1)%tracks.length; loadTrack(currentTrackIndex); if(isPlaying) playTrack(); });

    audio.addEventListener('timeupdate', function(){ if(audio.duration){ progressFill.style.width=(audio.currentTime/audio.duration*100)+'%'; currentTimeEl.textContent=formatTime(audio.currentTime); } });
    audio.addEventListener('loadedmetadata', function(){ totalTimeEl.textContent=formatTime(audio.duration); var d=tracklist.querySelector('[data-index="'+currentTrackIndex+'"]'); if(d) d.textContent=formatTime(audio.duration); });
    audio.addEventListener('ended', function(){ if(currentTrackIndex<tracks.length-1){currentTrackIndex++;loadTrack(currentTrackIndex);playTrack();}else{pauseTrack();currentTrackIndex=0;loadTrack(0);} });
    progressBar.addEventListener('click', function(e){ if(audio.duration){var r=progressBar.getBoundingClientRect(); audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration;} });

    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function(){ nav.classList.toggle('scrolled', window.scrollY>80); });
    var reveals = document.querySelectorAll('.reveal');
    var observer = new IntersectionObserver(function(entries){ entries.forEach(function(entry){ if(entry.isIntersecting){entry.target.classList.add('visible');observer.unobserve(entry.target);} }); }, {threshold:0.15});
    reveals.forEach(function(el){ observer.observe(el); });

    buildTracklist();
    loadTrack(0);

    /* Hamburger menu */
    var hamburger = document.getElementById('navHamburger');
    var navLinks = document.getElementById('navLinks');
    var navOverlay = document.getElementById('navOverlay');
    function toggleNav() {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        navOverlay.style.display = 'block';
        setTimeout(function(){ navOverlay.classList.add('visible'); }, 10);
      } else {
        navOverlay.classList.remove('visible');
        setTimeout(function(){ navOverlay.style.display = 'none'; }, 300);
      }
    }
    hamburger.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);
    navLinks.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { if (navLinks.classList.contains('open')) toggleNav(); }); });
  </script>

</body>
