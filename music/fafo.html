  <link rel="stylesheet" href="../css/style.css">
  <style>
    /* ── FAFO PAGE OVERRIDES ── */
    body {
      background: #05050a;
    }

    .fafo-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 120px 20px 80px;
    }

    .fafo-hero-bg {
      position: absolute;
      inset: 0;
      background-image: url('../Art/FAFO.png');
      background-size: cover;
      background-position: center top;
      filter: brightness(0.18) blur(3px);
    }

    .fafo-hero-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse at 50% 30%, rgba(139,95,207,0.12) 0%, transparent 60%),
        linear-gradient(180deg, rgba(5,5,10,0.3) 0%, rgba(5,5,10,0.7) 60%, #05050a 100%);
    }

    /* Purple lightning scan lines */
    .fafo-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(139,95,207,0.015) 3px,
        rgba(139,95,207,0.015) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    .fafo-hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      max-width: 900px;
      width: 100%;
    }

    .fafo-cover {
      width: 300px;
      height: 300px;
      object-fit: cover;
      border: 1px solid rgba(139,95,207,0.3);
      box-shadow: 
        0 0 80px rgba(139,95,207,0.25),
        0 0 30px rgba(139,95,207,0.1),
        0 20px 60px rgba(0,0,0,0.8);
      margin-bottom: 40px;
      animation: fadeUp 1.2s ease-out both;
    }

    .fafo-tag {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--purple-glow);
      margin-bottom: 16px;
      animation: fadeUp 1.2s ease-out 0.15s both;
    }

    .fafo-title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900;
      letter-spacing: 10px;
      color: #fff;
      text-shadow: 
        0 0 40px rgba(139,95,207,0.6),
        0 0 80px rgba(139,95,207,0.3);
      margin-bottom: 8px;
      animation: fadeUp 1.2s ease-out 0.25s both;
    }

    .fafo-subtitle {
      font-family: var(--font-heading);
      font-size: 0.65rem;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--purple-light);
      opacity: 0.8;
      margin-bottom: 6px;
      animation: fadeUp 1.2s ease-out 0.35s both;
    }

    .fafo-feat {
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-style: italic;
      color: var(--grey);
      letter-spacing: 2px;
      margin-bottom: 50px;
      animation: fadeUp 1.2s ease-out 0.45s both;
    }

    .fafo-feat span {
      color: var(--purple-light);
    }

    /* ── FAFO PLAYER ── */
    .fafo-player {
      width: 100%;
      max-width: 600px;
      background: rgba(10,8,18,0.9);
      border: 1px solid rgba(139,95,207,0.2);
      box-shadow: 
        0 0 60px rgba(139,95,207,0.08),
        inset 0 1px 0 rgba(139,95,207,0.1);
      padding: 36px 40px;
      animation: fadeUp 1.2s ease-out 0.55s both;
    }

    .fafo-player-label {
      font-family: var(--font-heading);
      font-size: 0.55rem;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--purple-glow);
      text-align: center;
      margin-bottom: 28px;
      opacity: 0.7;
    }

    .fafo-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .fafo-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--grey);
      transition: color 0.3s, transform 0.2s;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fafo-btn:hover { color: var(--purple-light); transform: scale(1.1); }
    .fafo-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .fafo-btn.play {
      width: 60px;
      height: 60px;
      border: 1px solid rgba(139,95,207,0.4);
      background: rgba(139,95,207,0.08);
      color: var(--purple-light);
      transition: all 0.3s;
    }
    .fafo-btn.play:hover {
      background: rgba(139,95,207,0.2);
      border-color: var(--purple-glow);
      box-shadow: 0 0 20px rgba(139,95,207,0.3);
      transform: scale(1.05);
    }
    .fafo-btn.play svg { width: 26px; height: 26px; }

    .fafo-progress {
      margin-bottom: 10px;
    }

    .fafo-bar-bg {
      width: 100%;
      height: 2px;
      background: rgba(139,95,207,0.15);
      cursor: pointer;
      position: relative;
      margin-bottom: 8px;
    }
    .fafo-bar-bg:hover .fafo-bar-fill { box-shadow: 0 0 8px rgba(139,95,207,0.8); }

    .fafo-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--purple-glow), var(--purple-light));
      transition: width 0.1s linear;
      box-shadow: 0 0 6px rgba(139,95,207,0.5);
    }

    .fafo-times {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--grey);
    }

    .fafo-track-name {
      font-family: var(--font-heading);
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--purple-light);
      text-align: center;
      margin-bottom: 24px;
    }

    /* ── STREAM BUTTONS ── */
    .fafo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 40px;
      animation: fadeUp 1.2s ease-out 0.65s both;
    }

    .fafo-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      font-family: var(--font-heading);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(139,95,207,0.3);
      color: var(--purple-light);
      background: rgba(139,95,207,0.05);
      transition: all 0.3s ease;
    }
    .fafo-action-btn:hover {
      background: rgba(139,95,207,0.15);
      border-color: var(--purple-glow);
      color: #fff;
      box-shadow: 0 0 20px rgba(139,95,207,0.2);
    }
    .fafo-action-btn.primary {
      border-color: rgba(139,95,207,0.5);
      background: rgba(139,95,207,0.1);
    }
    .fafo-action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    /* ── BACK LINK ── */
    .fafo-back {
      margin-top: 50px;
      text-align: center;
      animation: fadeUp 1.2s ease-out 0.75s both;
    }
    .fafo-back a {
      font-family: var(--font-heading);
      font-size: 0.6rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--grey);
      text-decoration: none;
      transition: color 0.3s;
    }
    .fafo-back a:hover { color: var(--purple-light); }

    /* ── PULSE CORNERS ── */
    .fafo-player::before,
    .fafo-player::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: var(--purple-glow);
      border-style: solid;
      opacity: 0.5;
    }
    .fafo-player { position: relative; }
    .fafo-player::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
    .fafo-player::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 640px) {
      .fafo-cover { width: 220px; height: 220px; }
      .fafo-player { padding: 28px 24px; }
      .fafo-action-btn { padding: 12px 20px; font-size: 0.6rem; }
    }
  </style>

  <script>
    var audio = new Audio('../Songs/FAFO/01 - FAFO.mp3');
    var isPlaying = false;
    var playBtn = document.getElementById('playBtn');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var progressBar = document.getElementById('progressBar');
    var progressFill = document.getElementById('progressFill');
    var currentTimeEl = document.getElementById('currentTime');
    var totalTimeEl = document.getElementById('totalTime');

    function formatTime(s) { if (isNaN(s)) return '0:00'; var m = Math.floor(s/60); var sec = Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

    function playTrack() { audio.play().then(function(){ isPlaying=true; playIcon.style.display='none'; pauseIcon.style.display='block'; }).catch(function(){}); }
    function pauseTrack() { audio.pause(); isPlaying=false; playIcon.style.display='block'; pauseIcon.style.display='none'; }

    playBtn.addEventListener('click', function(){ if(isPlaying) pauseTrack(); else playTrack(); });

    audio.addEventListener('timeupdate', function(){ if(audio.duration){ progressFill.style.width=(audio.currentTime/audio.duration*100)+'%'; currentTimeEl.textContent=formatTime(audio.currentTime); } });
    audio.addEventListener('loadedmetadata', function(){ totalTimeEl.textContent=formatTime(audio.duration); });
    audio.addEventListener('ended', function(){ pauseTrack(); audio.currentTime=0; });
    progressBar.addEventListener('click', function(e){ if(audio.duration){ var r=progressBar.getBoundingClientRect(); audio.currentTime=((e.clientX-r.left)/r.width)*audio.duration; } });

    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function(){ nav.classList.toggle('scrolled', window.scrollY>80); });

    /* Hamburger menu */
    var hamburger = document.getElementById('navHamburger');
    var navLinks = document.getElementById('navLinks');
    var navOverlay = document.getElementById('navOverlay');
    function toggleNav() {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        navOverlay.style.display = 'block';
        setTimeout(function(){ navOverlay.classList.add('visible'); }, 10);
      } else {
        navOverlay.classList.remove('visible');
        setTimeout(function(){ navOverlay.style.display = 'none'; }, 300);
      }
    }
    hamburger.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);
    navLinks.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { if (navLinks.classList.contains('open')) toggleNav(); }); });
  </script>
