<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videos — Pills on the Parmesian</title>
  <meta name="description" content="Music videos from Pills on the Parmesian — Static in My Veins, Neon Horizon, and more.">
  <meta name="theme-color" content="#050308">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Chakra+Petch:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pills.css">
  <style>
    .video-grid { display: grid; grid-template-columns: 1fr; gap: 60px; max-width: 900px; margin: 0 auto; }
    .video-card { text-align: center; }
    .video-frame-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: 4px; overflow: hidden; border: 1px solid rgba(139,47,214,0.3); box-shadow: 0 0 30px rgba(139,47,214,0.2); margin-bottom: 18px; }
    .video-frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-title { font-family: var(--font-heading); font-size: 1.2rem; letter-spacing: 1px; color: var(--text); margin-bottom: 6px; }
    .video-meta { font-family: var(--font-body); font-size: 0.9rem; color: var(--magenta); text-transform: uppercase; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="nav-overlay" id="navOverlay"></div>
  <nav class="nav scrolled" id="nav">
    <button class="nav-hamburger" id="navHamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="music.html">Music</a>
      <a href="videos.html" class="active">Videos</a>
      <a href="about.html">About</a>
      <a href="../contact.html">Contact</a>
      <a href="../home.html">Heaven is Overrated</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-header-bg" style="background-image: url('art/bg-texture.png');"></div>
    <div class="page-header-content">
      <div class="section-title">Videos</div>
      <div class="section-label">Watch The Signal</div>
    </div>
  </div>

  <section class="section">
    <div class="section-inner" style="max-width: 900px;">
      <div class="video-grid">

        <div class="video-card reveal">
          <div class="video-frame-wrap">
            <iframe src="https://www.youtube.com/embed/xAc_0Z0MdxU" title="Static in My Veins" allowfullscreen></iframe>
          </div>
          <div class="video-title">Static in My Veins</div>
          <div class="video-meta">Music Video</div>
        </div>

        <div class="video-card reveal">
          <div class="video-frame-wrap">
            <iframe src="https://www.youtube.com/embed/3xoEqtSyASU" title="Neon Horizon" allowfullscreen></iframe>
          </div>
          <div class="video-title">Neon Horizon</div>
          <div class="video-meta">Music Video</div>
        </div>

        <div class="video-card reveal">
          <div class="video-frame-wrap">
            <iframe src="https://www.youtube.com/embed/in-cRTtygjI" title="Force Quit — Promo" allowfullscreen></iframe>
          </div>
          <div class="video-title">Force Quit</div>
          <div class="video-meta">Promo Video</div>
        </div>

      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-logo">Pills on the Parmesian</div>
    <div class="footer-sub">&copy; 2026 &mdash; All Rights Reserved</div>
    <div class="footer-crosslink"><a href="../home.html">&larr; Heaven is Overrated</a></div>
  </footer>

  <script>
    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function() { nav.classList.toggle('scrolled', window.scrollY > 80); });
    var reveals = document.querySelectorAll('.reveal');
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
    }, { threshold: 0.15 });
    reveals.forEach(function(el) { observer.observe(el); });

    var hamburger = document.getElementById('navHamburger');
    var navLinks = document.getElementById('navLinks');
    var navOverlay = document.getElementById('navOverlay');
    function toggleNav() {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
      if (navLinks.classList.contains('open')) {
        navOverlay.style.display = 'block';
        setTimeout(function(){ navOverlay.classList.add('visible'); }, 10);
      } else {
        navOverlay.classList.remove('visible');
        setTimeout(function(){ navOverlay.style.display = 'none'; }, 300);
      }
    }
    hamburger.addEventListener('click', toggleNav);
    navOverlay.addEventListener('click', toggleNav);
    navLinks.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', function() { if (navLinks.classList.contains('open')) toggleNav(); }); });
  </script>

</body>
</html>
